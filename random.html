<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #B0E0E6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .randomizer-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
            /* Добавим overflow: hidden, чтобы анимация не вылезала за края */
            overflow: hidden; 
        }

        h2 {
            color: #005A9C;
            margin-top: 0;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        #maxNumber {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 100px;
            text-align: center;
            font-size: 16px;
        }
        
        #generateBtn {
            background-color: #007BFF;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s, opacity 0.2s;
        }

        #generateBtn:hover {
            background-color: #0056b3;
        }

        /* Стиль для неактивной кнопки во время анимации */
        #generateBtn:disabled {
            background-color: #999;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
        }

        #resultNumber {
            display: block;
            font-size: 4em;
            font-weight: bold;
            color: #005A9C;
            margin-top: 10px;
            min-height: 70px; 
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s, transform 0.2s, filter 0.2s;
        }
        
        /* * НОВЫЙ СТИЛЬ: для "размытия" чисел во время прокрутки
         */
        #resultNumber.spinning {
            filter: blur(2px); /* Размытие */
            opacity: 0.6; /* Полупрозрачность */
            transition: none; /* Убираем плавность, чтобы числа менялись мгновенно */
        }

        /*
         * Анимация "приземления" числа (остается та же)
         */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animated-number {
            animation: fadeInScale 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="randomizer-container">
        <h2>Генератор чисел</h2>
        
        <div class="input-group">
            <label for="maxNumber">Число от 1 до:</label>
            <input type="number" id="maxNumber" value="100">
        </div>

        <button id="generateBtn">Генерировать!</button>

        <div id="result">
            Случайное число:
            <span id="resultNumber">...</span>
        </div>
    </div>

    <script>
        // --- ГЛОБАЛЬНЫЕ ИЗМЕНЕНИЯ В JAVASCRIPT ---

        const maxInput = document.getElementById('maxNumber');
        const genButton = document.getElementById('generateBtn');
        const resultDisplay = document.getElementById('resultNumber');

        // Переменная для хранения нашего интервала "прокрутки"
        let spinInterval = null; 

        function generateRandomNumber() {
            // 1. Проверка введенного числа
            const max = parseInt(maxInput.value);
            if (isNaN(max) || max <= 0) {
                alert('Пожалуйста, введите положительное число больше нуля.');
                resultDisplay.textContent = 'X';
                resultDisplay.classList.remove('animated-number', 'spinning');
                return;
            }

            // 2. СНАЧАЛА вычисляем ФИНАЛЬНОЕ число
            const finalRandomNum = Math.floor(Math.random() * max) + 1;

            // 3. Запускаем анимацию "прокрутки"
            
            // Блокируем кнопку, чтобы не нажали дважды
            genButton.disabled = true;
            genButton.textContent = 'Выбираем...'; // Меняем текст на кнопке

            // Убираем старую анимацию "приземления" и добавляем класс "прокрутки"
            resultDisplay.classList.remove('animated-number');
            resultDisplay.classList.add('spinning');

            // Запускаем интервал: каждые 50 миллисекунд будет показываться новое случайное число
            spinInterval = setInterval(() => {
                const tempNum = Math.floor(Math.random() * max) + 1;
                resultDisplay.textContent = tempNum;
            }, 50); // 50ms - очень быстрая смена

            // 4. Устанавливаем таймер, который остановит "прокрутку"
            // 2500 миллисекунд = 2.5 секунды (как вы и хотели, 2-3 сек)
            setTimeout(() => {
                // Останавливаем интервал "прокрутки"
                clearInterval(spinInterval);

                // Возвращаем кнопку в нормальное состояние
                genButton.disabled = false;
                genButton.textContent = 'Генерировать!';

                // Убираем класс "прокрутки"
                resultDisplay.classList.remove('spinning');

                // 5. Показываем ФИНАЛЬНОЕ число
                resultDisplay.textContent = finalRandomNum;
                
                // 6. Запускаем красивую анимацию "приземления"
                resultDisplay.classList.add('animated-number');

            }, 2500); // <-- ВОТ ЗДЕСЬ УКАЗАНА ДЛИТЕЛЬНОСТЬ
        }

        // --- Логика для ПЕРВОЙ ЗАГРУЗКИ (без прокрутки) ---
        function setInitialNumber() {
            const max = parseInt(maxInput.value) || 100;
            const randomNum = Math.floor(Math.random() * max) + 1;
            resultDisplay.textContent = randomNum;
            // Сразу запускаем анимацию "приземления"
            resultDisplay.classList.add('animated-number');
        }

        // "Вешаем" событие на кнопку
        genButton.addEventListener('click', generateRandomNumber);
        
        // Генерируем число при первой загрузке (без долгой прокрутки)
        setInitialNumber();

    </script>

</body>
</html>
